<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XPENG — Issue Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f5f0;--card:#fff;--border:#e8e6e0;
  --text:#1a1a1a;--text2:#666;--text3:#999;
  --blue:#1a56db;--blue-lt:#e8f0fe;
  --green:#0e7d5e;--green-lt:#d1fae5;
  --orange:#c2410c;--orange-lt:#ffedd5;
  --red:#be123c;--red-lt:#ffe4e6;
  --purple:#6d28d9;--purple-lt:#ede9fe;
  --r:12px;--rs:8px;--sh:0 1px 4px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}

/* TOPBAR */
.topbar{background:#fff;border-bottom:1px solid var(--border);height:58px;display:flex;align-items:center;padding:0 24px;gap:14px;position:sticky;top:0;z-index:100;box-shadow:0 1px 0 var(--border),0 2px 8px rgba(0,0,0,.04)}
.logo{font-size:16px;font-weight:700;color:#fff;background:var(--blue);padding:5px 12px;border-radius:var(--rs);letter-spacing:.5px}
.sep{width:1px;height:22px;background:var(--border)}
.topbar-title{font-size:13px;color:var(--text2);font-weight:400;letter-spacing:.1px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.tab-btn{display:flex;align-items:center;gap:6px;padding:7px 16px;border-radius:20px;border:1.5px solid transparent;background:transparent;font-family:inherit;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .2s;letter-spacing:.2px}
.tab-btn:hover{color:var(--blue);background:var(--blue-lt);border-color:var(--blue-lt)}
.tab-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 2px 8px rgba(26,86,219,.3)}
.ibtn{display:flex;align-items:center;gap:5px;padding:6px 14px;border-radius:var(--rs);border:none;font-family:inherit;font-size:12px;cursor:pointer;transition:all .15s;font-weight:500}
.ibtn-blue{background:var(--blue);color:#fff}.ibtn-blue:hover{background:#1648c0}
.ibtn-green{background:var(--green);color:#fff}.ibtn-green:hover{background:#075e47}
.ibtn-purple{background:var(--purple);color:#fff}.ibtn-purple:hover{background:#5b21b6}
.ibtn-gray{background:#f1f5f9;color:var(--text2);border:1px solid var(--border)}.ibtn-gray:hover{background:#e2e8f0}
.ibtn-red{background:var(--red);color:#fff}.ibtn-red:hover{background:#9f1239}

/* VIEWS */
.view{display:none;padding:20px 24px;max-width:1400px;margin:0 auto}
.view.active{display:block}

/* FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:24px;box-shadow:var(--sh)}
.form-card h2{font-size:15px;font-weight:600;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.form-card h2 i{color:var(--blue);font-size:18px}
.field{margin-bottom:14px}
.field label{font-size:12px;font-weight:500;color:var(--text2);display:block;margin-bottom:5px}
.field label span{color:var(--red)}
.inp,.sel,.ta{width:100%;border:1px solid var(--border);border-radius:var(--rs);padding:9px 12px;font-size:13px;font-family:inherit;color:var(--text);background:#fafaf8;outline:none;transition:border .15s}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--blue);background:#fff}
.ta{resize:vertical;min-height:80px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-actions{display:flex;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.required-note{font-size:11px;color:var(--text3);margin-top:16px}

/* STATUS BADGE */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:3px 8px;border-radius:20px;font-weight:500;white-space:nowrap}
.b-open{background:var(--blue-lt);color:var(--blue)}
.b-prog{background:var(--orange-lt);color:var(--orange)}
.b-done{background:var(--green-lt);color:var(--green)}
.b-cancel{background:#f1f5f9;color:#64748b}

/* KPIs */
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kpi.c1::before{background:var(--blue)}.kpi.c2::before{background:var(--green)}
.kpi.c3::before{background:#ea580c}.kpi.c4::before{background:var(--red)}.kpi.c5::before{background:var(--purple)}
.kpi-ic{width:30px;height:30px;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:8px}
.kpi.c1 .kpi-ic{background:var(--blue-lt);color:var(--blue)}.kpi.c2 .kpi-ic{background:var(--green-lt);color:var(--green)}
.kpi.c3 .kpi-ic{background:#ffedd5;color:#ea580c}.kpi.c4 .kpi-ic{background:var(--red-lt);color:var(--red)}
.kpi.c5 .kpi-ic{background:var(--purple-lt);color:var(--purple)}
.kpi-lbl{font-size:11px;color:var(--text2);margin-bottom:4px}
.kpi-val{font-size:24px;font-weight:600}
.kpi.c1 .kpi-val{color:var(--blue)}.kpi.c2 .kpi-val{color:var(--green)}
.kpi.c3 .kpi-val{color:#ea580c}.kpi.c4 .kpi-val{color:var(--red)}.kpi.c5 .kpi-val{color:var(--purple)}

/* CHARTS */
.charts-row{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;margin-bottom:20px}
.cc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.cc-hdr{font-size:13px;font-weight:500;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.cc-hdr i{color:var(--blue);font-size:16px}
.leg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.li{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text2)}
.ld{width:8px;height:8px;border-radius:2px}

/* TABLE */
.tc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.tc-hdr{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tc-hdr h3{font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px}
.tc-hdr h3 i{color:var(--blue);font-size:16px}
.tc-tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.srch{display:flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:var(--rs);padding:5px 10px;background:var(--bg)}
.srch:focus-within{border-color:var(--blue)}
.srch i{font-size:13px;color:var(--text3)}
.srch input{border:none;background:transparent;font-size:12px;font-family:inherit;outline:none;width:140px;color:var(--text)}
.fsel{border:1px solid var(--border);border-radius:var(--rs);padding:5px 8px;font-size:12px;font-family:inherit;background:var(--bg);color:var(--text);outline:none}
.tw{overflow-x:auto;max-height:420px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:var(--bg);font-weight:500;color:var(--text2);padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:1}
tbody td{padding:7px 10px;border-bottom:1px solid #f5f5f0;color:var(--text);vertical-align:middle}
tbody tr:hover td{background:var(--blue-lt)}
.td-actions{display:flex;gap:4px}
.act-btn{border:none;background:transparent;cursor:pointer;padding:3px 6px;border-radius:5px;font-size:13px;transition:background .15s;color:var(--text2)}
.act-btn:hover{background:var(--border)}
.act-btn.del:hover{background:var(--red-lt);color:var(--red)}
.act-btn.edit:hover{background:var(--blue-lt);color:var(--blue)}
.empty-state{text-align:center;padding:48px;color:var(--text3)}
.empty-state i{font-size:40px;display:block;margin-bottom:10px}

/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:var(--r);width:580px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-hdr{display:flex;align-items:center;gap:10px;padding:20px 24px;border-bottom:1px solid var(--border)}
.modal-hdr h2{font-size:15px;font-weight:600;flex:1}
.modal-close{background:transparent;border:none;font-size:20px;cursor:pointer;color:var(--text3);line-height:1}
.modal-body{padding:20px 24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}

/* EXPORT DROPDOWN */
.exp-dd{position:relative}
.exp-menu{display:none;position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:0 8px 30px rgba(0,0,0,.15);width:230px;z-index:200;overflow:hidden}
.exp-menu.open{display:block}
.exp-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;background:transparent;border:none;border-top:1px solid var(--border);cursor:pointer;font-family:inherit;text-align:left;font-size:12px;color:var(--text);transition:background .1s}
.exp-item:first-child{border-top:none}
.exp-item:hover{background:var(--blue-lt)}
.exp-item i{font-size:18px;flex-shrink:0}
.exp-label{display:flex;flex-direction:column;gap:1px}
.exp-label b{font-weight:500}
.exp-label span{font-size:10px;color:var(--text3)}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 20px;border-radius:var(--rs);font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;display:flex;align-items:center;gap:8px}
.toast.show{opacity:1}

/* CREDIT */
.credit{position:fixed;bottom:10px;right:16px;font-size:10px;color:#aaa;pointer-events:none;z-index:400;font-family:'Sarabun',sans-serif}
.credit span{color:#60a5fa;font-weight:500}

@media(max-width:900px){.form-grid,.charts-row,.kpi-row{grid-template-columns:1fr}}
@media(max-width:600px){.view{padding:12px}.topbar{padding:0 12px}}
@media print{@page{size:A4;margin:12mm}body{margin:0}.no-print{display:none}}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="logo">XPENG</div>
  <div class="sep"></div>
  <div class="topbar-title">Issue Tracker</div>
  <div class="topbar-right">
    <button class="tab-btn active" id="tabForm" onclick="switchTab('form')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      บันทึกปัญหา
    </button>
    <button class="tab-btn" id="tabDash" onclick="switchTab('dash')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Dashboard
    </button>
    <button class="tab-btn" id="tabList" onclick="switchTab('list')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1.2" fill="currentColor"/><circle cx="3" cy="12" r="1.2" fill="currentColor"/><circle cx="3" cy="18" r="1.2" fill="currentColor"/></svg>
      รายการ
    </button>
    <button class="ibtn ibtn-gray" onclick="backupData()" title="สำรองข้อมูลเป็น JSON">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Backup
    </button>
    <label class="ibtn ibtn-gray" style="cursor:pointer" title="นำเข้าข้อมูลจากไฟล์ JSON">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Restore
      <input type="file" accept=".json" onchange="restoreData(event)" style="display:none">
    </label>
    <div class="exp-dd">
      <button class="ibtn ibtn-purple" onclick="toggleExp()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export
      </button>
      <div class="exp-menu" id="expMenu">
        <button class="exp-item" onclick="exportExcel()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0e7d5e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/><polyline points="10 9 9 9 8 9"/></svg><div class="exp-label"><b>Excel (.xlsx)</b><span>ข้อมูลทั้งหมด</span></div></button>
        <button class="exp-item" onclick="exportPDF('full')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#be123c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg><div class="exp-label"><b>PDF รายงานเต็ม A4</b><span>KPI + กราฟ + ตาราง</span></div></button>
        <button class="exp-item" onclick="exportPDF('summary')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a56db" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg><div class="exp-label"><b>PDF สรุป 1 หน้า</b><span>เหมาะส่งผู้บริหาร</span></div></button>
        <div style="border-top:1px solid var(--border);padding:6px 14px;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px">Dashboard</div>
        <button class="exp-item" onclick="exportDashPDF()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6d28d9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><div class="exp-label"><b>PDF หน้า Dashboard</b><span>กราฟ + KPI พร้อมพิมพ์</span></div></button>
        <button class="exp-item" onclick="exportDashHTML()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ea580c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg><div class="exp-label"><b>HTML Dashboard</b><span>ส่งให้คนอื่นเปิดดูได้</span></div></button>
        <button class="exp-item" onclick="exportDashPNG()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0369a1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><div class="exp-label"><b>ภาพ PNG Dashboard</b><span>บันทึกเป็นรูปภาพ</span></div></button>
      </div>
    </div>
  </div>
</div>

<!-- VIEW: FORM -->
<div class="view active" id="viewForm">
  <div class="form-grid">
    <div class="form-card">
      <h2 style="display:flex;align-items:center;gap:8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg><span id="formTitle">บันทึกปัญหาใหม่</span></h2>
      <input type="hidden" id="editId">

      <div class="field-row">
        <div class="field">
          <label>วันที่แจ้ง <span>*</span></label>
          <input class="inp" type="date" id="fDate">
        </div>
        <div class="field">
          <label>เวลาที่แจ้ง</label>
          <input class="inp" type="time" id="fTime">
        </div>
      </div>

      <div class="field">
        <label>ชื่อลูกค้า <span>*</span></label>
        <input class="inp" type="text" id="fCustomer" placeholder="ชื่อ-นามสกุล">
      </div>

      <div class="field-row">
        <div class="field">
          <label>รุ่นรถ <span>*</span></label>
          <select class="sel" id="fModel">
            <option value="">— เลือก —</option>
            <option>XPENG G6 Standard 2025</option>
            <option>XPENG G6 Long range 2025</option>
            <option>XPENG G6 Standard 2026</option>
            <option>XPENG G6 Long range 2026</option>
            <option>XPENG X9 Executive 2024</option>
            <option>XPENG X9 Executive 2025</option>
            <option>XPENG X9 Executive 2026</option>
            <option>XPENG X9 Premium 2026</option>
            <option>XPENG X9 Luxury 2026</option>
            <option>XPENG G9 2024</option>
            <option>XPENG P7 2024</option>
            <option disabled>──────────</option>
            <option>XPENG L03 Standard Range Plus</option>
            <option>XPENG L03 Long Range Plus</option>
            <option>XPENG L03 Long Range Ultra</option>
          </select>
        </div>
        <div class="field">
          <label>เลข VIN</label>
          <input class="inp" type="text" id="fVIN" placeholder="L1NNS...">
        </div>
      </div>

      <div class="field">
        <label>ประเภทปัญหา <span>*</span></label>
        <select class="sel" id="fCategory">
          <option value="">— เลือก —</option>
          <option>ซอฟต์แวร์ / OTA</option>
          <option>ระบบเสียง / มัลติมีเดีย</option>
          <option>ระบบ ADAS / ความปลอดภัย</option>
          <option>ระบบชาร์จ</option>
          <option>แอร์ / Climate Control</option>
          <option>กระจก / ประตู</option>
          <option>ระบบไฟ</option>
          <option>Apple CarPlay / Android Auto</option>
          <option>XPENG App</option>
          <option>ช่วงล่าง / เบรก</option>
          <option>อื่นๆ</option>
        </select>
      </div>

      <div class="field">
        <label>รายละเอียดปัญหา <span>*</span></label>
        <textarea class="ta" id="fDetail" placeholder="อธิบายปัญหาโดยละเอียด..."></textarea>
      </div>

      <div class="field-row">
        <div class="field">
          <label>ผู้รับผิดชอบ</label>
          <input class="inp" type="text" id="fStaff" placeholder="ชื่อผู้รับผิดชอบ">
        </div>
        <div class="field">
          <label>สถานะ</label>
          <select class="sel" id="fStatus">
            <option value="รอดำเนินการ">รอดำเนินการ</option>
            <option value="กำลังดำเนินการ">กำลังดำเนินการ</option>

      <div class="required-note">* จำเป็นต้องกรอก</div>

    <!-- RECENT -->
    <div class="form-card">
      <h2>รายการล่าสุด</h2>
      <div id="recentList" style="display:flex;flex-direction:column;gap:10px"></div>
    </div>
  </div>
</div>

<!-- VIEW: DASHBOARD -->
<div class="view" id="viewDash">
  <div class="kpi-row">
    <div class="kpi c1"><div class="kpi-ic"></div><div class="kpi-lbl">ทั้งหมด</div><div class="kpi-val" id="k0">0</div></div>
    <div class="kpi c2"><div class="kpi-ic"></div><div class="kpi-lbl">แก้ไขแล้ว</div><div class="kpi-val" id="k1">0</div></div>
    <div class="kpi c3"><div class="kpi-ic"></div><div class="kpi-lbl">กำลังดำเนินการ</div><div class="kpi-val" id="k2">0</div></div>
    <div class="kpi c4"><div class="kpi-ic"></div><div class="kpi-lbl">รอดำเนินการ</div><div class="kpi-val" id="k3">0</div></div>
    <div class="kpi c5"><div class="kpi-ic"></div><div class="kpi-lbl">รุ่นรถที่พบปัญหา</div><div class="kpi-val" id="k4">0</div></div>
  </div>
  <div class="charts-row">
    <div class="cc"><div class="cc-hdr">ตามประเภทปัญหา</div><div style="height:220px"><canvas id="cCat"></canvas></div></div>
    <div class="cc"><div class="cc-hdr">สถานะ</div><div class="leg" id="statusLeg"></div><div style="height:170px"><canvas id="cStatus"></canvas></div></div>
  </div>
  <div class="charts-row">
    <div class="cc"><div class="cc-hdr">ผู้รับผิดชอบ</div><div class="leg" id="staffLeg"></div><div style="height:150px"><canvas id="cStaff"></canvas></div></div>
    <div class="cc"><div class="cc-hdr">แนวโน้มรายวัน</div><div style="height:170px"><canvas id="cTrend"></canvas></div></div>
  </div>
</div>

<!-- VIEW: LIST -->
<div class="view" id="viewList">
  <div class="tc">
    <div class="tc-hdr">
      <h3>รายการปัญหาทั้งหมด</h3>
      <div class="tc-tools">
        <div class="srch"><input id="srchInp" placeholder="ค้นหา..." oninput="renderList()"></div>
        <select class="fsel" id="fltStatus" onchange="renderList()">
          <option value="">ทุกสถานะ</option>
          <option>รอดำเนินการ</option>
          <option>กำลังดำเนินการ</option>
          <option>แก้ไขแล้ว</option>
          <option>ยกเลิก</option>
        </select>
        <select class="fsel" id="fltModel" onchange="renderList()"><option value="">ทุกรุ่น</option></select>
        <select class="fsel" id="fltMonth" onchange="renderList()"><option value="">ทุกเดือน</option></select>
      </div>
    </div>
    <div class="tw" id="listWrap"></div>
  </div>
</div>

<!-- MODAL: EDIT -->
<div class="modal-ov" id="editModal" style="display:none">
  <div class="modal">
    <div class="modal-hdr">
      <i class="ti ti-edit" style="font-size:20px;color:var(--blue)"></i>
      <h2>แก้ไขรายการ</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="field-row">
        <div class="field"><label>สถานะ</label>
          <select class="sel" id="mStatus">
            <option>รอดำเนินการ</option><option>กำลังดำเนินการ</option><option>แก้ไขแล้ว</option><option>ยกเลิก</option>
          </select>
        </div>
        <div class="field"><label>ผู้รับผิดชอบ</label><input class="inp" id="mStaff"></div>
      </div>
      <div class="field"><label>หมายเหตุ</label><textarea class="ta" id="mNote"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="ibtn ibtn-gray" onclick="closeModal()">ยกเลิก</button>
      <button class="ibtn ibtn-blue" onclick="saveModal()">บันทึก</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- CREDIT -->
<div class="credit">crafted by <span>Bancha</span></div>

<script>
// ══ DATA ══
const DB_KEY = 'xpeng_issues_v2';
const COLORS = ['#1a56db','#0e7d5e','#c2410c','#be123c','#6d28d9','#0369a1','#166534','#9a3412','#7c3aed','#0f766e'];
const MONTHS = ['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const MONTH_FULL = ['','มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
let charts = {}, editingId = null;

function loadData(){ try{ return JSON.parse(localStorage.getItem(DB_KEY)||'[]'); }catch(e){ return []; } }
function saveData(d){ localStorage.setItem(DB_KEY, JSON.stringify(d)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

// ══ TAB ══
function switchTab(tab){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('view'+tab.charAt(0).toUpperCase()+tab.slice(1)).classList.add('active');
  document.getElementById('tab'+tab.charAt(0).toUpperCase()+tab.slice(1)).classList.add('active');
  if(tab==='dash') renderDash();
  if(tab==='list') renderList();
}

// ══ FORM ══
function setToday(){
  const now = new Date();
  document.getElementById('fDate').value = now.toISOString().slice(0,10);
  document.getElementById('fTime').value = now.toTimeString().slice(0,5);
}

function clearForm(){
  ['fDate','fTime','fCustomer','fModel','fVIN','fCategory','fDetail','fStaff','fNote'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.value='';
  });
  document.getElementById('fStatus').value='รอดำเนินการ';
  document.getElementById('editId').value='';
  document.getElementById('formTitle').textContent='บันทึกปัญหาใหม่';
  setToday();
}

function saveIssue(){
  const date=document.getElementById('fDate').value;
  const customer=document.getElementById('fCustomer').value.trim();
  const model=document.getElementById('fModel').value;
  const category=document.getElementById('fCategory').value;
  const detail=document.getElementById('fDetail').value.trim();
  if(!date||!customer||!model||!category||!detail){ toast('⚠ กรุณากรอกข้อมูลที่จำเป็น','#c2410c'); return; }

  const issue={
    id: document.getElementById('editId').value||uid(),
    date, time: document.getElementById('fTime').value,
    customer, model, vin: document.getElementById('fVIN').value.trim(),
    category, detail,
    staff: document.getElementById('fStaff').value.trim(),
    status: document.getElementById('fStatus').value,
    note: document.getElementById('fNote').value.trim(),
    createdAt: new Date().toISOString()
  };

  const data = loadData();
  const idx = data.findIndex(d=>d.id===issue.id);
  if(idx>=0) data[idx]=issue; else data.unshift(issue);
  saveData(data);
  toast('✅ บันทึกเรียบร้อย');
  clearForm();
  renderRecent();
}

function renderRecent(){
  const data = loadData().slice(0,5);
  const el = document.getElementById('recentList');
  if(!data.length){ el.innerHTML='<div style="text-align:center;padding:32px;color:var(--text3);font-size:13px"><i class="ti ti-inbox" style="font-size:28px;display:block;margin-bottom:8px"></i>ยังไม่มีข้อมูล</div>'; return; }
  el.innerHTML = data.map(d=>`
    <div style="border:1px solid var(--border);border-radius:var(--rs);padding:12px;background:var(--bg)">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <span style="font-size:12px;font-weight:500;flex:1">${d.customer}</span>
        ${badgeHTML(d.status)}
      </div>
      <div style="font-size:11px;color:var(--text2);margin-bottom:4px">${d.model} · ${d.category}</div>
      <div style="font-size:11px;color:var(--text3)">${d.date} ${d.time||''} · ${d.staff||'—'}</div>
    </div>`).join('');
}

// ══ BADGE ══
function badgeHTML(status){
  const map={'แก้ไขแล้ว':'b-done','กำลังดำเนินการ':'b-prog','รอดำเนินการ':'b-open','ยกเลิก':'b-cancel'};
  return `<span class="badge ${map[status]||'b-open'}">${status}</span>`;
}

// ══ DASHBOARD ══
function renderDash(){
  const data = loadData();
  let done=0,prog=0,pend=0;
  data.forEach(d=>{
    if(d.status==='แก้ไขแล้ว') done++;
    else if(d.status==='กำลังดำเนินการ') prog++;
    else if(d.status==='รอดำเนินการ') pend++;
  });
  document.getElementById('k0').textContent=data.length;
  document.getElementById('k1').textContent=done;
  document.getElementById('k2').textContent=prog;
  document.getElementById('k3').textContent=pend;
  document.getElementById('k4').textContent=new Set(data.map(d=>d.model).filter(Boolean)).size;

  drawBar('cCat', topN(data,'category',8));
  drawDoughnut('cStatus','statusLeg', topN(data,'status',5));
  drawDoughnut('cStaff','staffLeg', topN(data,'staff',8));
  drawTrend('cTrend', data);
}

function topN(data,key,n){
  const c={};
  data.forEach(d=>{ const v=d[key]||'(ไม่ระบุ)'; c[v]=(c[v]||0)+1; });
  return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,n);
}

function dc(id){ if(charts[id]){ charts[id].destroy(); delete charts[id]; } }

function drawBar(id, entries){
  dc(id);
  if(!entries.length) return;
  const el=document.getElementById(id); if(!el) return;
  el.parentElement.style.height=Math.max(220,entries.length*32+60)+'px';
  charts[id]=new Chart(el,{type:'bar',
    data:{labels:entries.map(x=>x[0]),datasets:[{data:entries.map(x=>x[1]),backgroundColor:COLORS.map(c=>c+'cc'),borderColor:COLORS,borderWidth:1,borderRadius:4}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{stepSize:1,font:{size:10,family:'Sarabun'}}},y:{ticks:{font:{size:10,family:'Sarabun'}}}}}
  });
}

function drawDoughnut(id,legId,entries){
  dc(id);
  if(!entries.length) return;
  const el=document.getElementById(id); if(!el) return;
  document.getElementById(legId).innerHTML=entries.map((x,i)=>`<span class="li"><span class="ld" style="background:${COLORS[i%COLORS.length]}"></span>${x[0]} (${x[1]})</span>`).join('');
  charts[id]=new Chart(el,{type:'doughnut',
    data:{labels:entries.map(x=>x[0]),datasets:[{data:entries.map(x=>x[1]),backgroundColor:COLORS.map(c=>c+'e0'),borderColor:'#fff',borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},cutout:'58%'}
  });
}

function drawTrend(id,data){
  dc(id);
  const el=document.getElementById(id); if(!el) return;
  const cnt={};
  data.forEach(d=>{ if(d.date) cnt[d.date]=(cnt[d.date]||0)+1; });
  const keys=Object.keys(cnt).sort();
  if(!keys.length) return;
  charts[id]=new Chart(el,{type:'line',
    data:{labels:keys,datasets:[{label:'เคส',data:keys.map(k=>cnt[k]),borderColor:'#1a56db',backgroundColor:'#1a56db15',tension:0.4,fill:true,pointRadius:3,pointBackgroundColor:'#1a56db'}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:9,family:'Sarabun'},maxTicksLimit:12}},y:{ticks:{stepSize:1,font:{size:10,family:'Sarabun'}}}}}
  });
}

// ══ LIST ══
function renderList(){
  const data = loadData();
  const q=(document.getElementById('srchInp').value||'').toLowerCase();
  const st=document.getElementById('fltStatus').value;
  const ml=document.getElementById('fltModel').value;
  const mo=document.getElementById('fltMonth').value;

  // build model filter options
  const models=new Set(data.map(d=>d.model).filter(Boolean));
  const mSel=document.getElementById('fltModel');
  const curM=mSel.value;
  mSel.innerHTML='<option value="">ทุกรุ่น</option>'+[...models].sort().map(m=>`<option${m===curM?' selected':''}>${m}</option>`).join('');

  // build month filter options
  const months=new Set(data.map(d=>d.date?d.date.slice(0,7):'').filter(Boolean));
  const moSel=document.getElementById('fltMonth');
  const curMo=moSel.value;
  moSel.innerHTML='<option value="">ทุกเดือน</option>'+[...months].sort().reverse().map(m=>{
    const [yr,mn]=m.split('-');
    return `<option value="${m}"${m===curMo?' selected':''}>${MONTHS[parseInt(mn)]} ${yr}</option>`;
  }).join('');

  const filtered=data.filter(d=>{
    if(st&&d.status!==st) return false;
    if(ml&&d.model!==ml) return false;
    if(mo&&(!d.date||!d.date.startsWith(mo))) return false;
    if(q&&!Object.values(d).join(' ').toLowerCase().includes(q)) return false;
    return true;
  });

  const wrap=document.getElementById('listWrap');
  if(!filtered.length){
    wrap.innerHTML=`<div class="empty-state">ไม่พบข้อมูล</div>`;
    return;
  }

  wrap.innerHTML=`<table>
    <thead><tr>
      <th>วันที่</th><th>ลูกค้า</th><th>รุ่นรถ</th><th>ประเภท</th><th>รายละเอียด</th><th>ผู้รับผิดชอบ</th><th>สถานะ</th><th>VIN</th><th></th>
    </tr></thead>
    <tbody>${filtered.map(d=>`<tr>
      <td style="white-space:nowrap">${d.date}<br><span style="font-size:10px;color:var(--text3)">${d.time||''}</span></td>
      <td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${d.customer}">${d.customer}</td>
      <td style="white-space:nowrap;font-size:11px">${d.model}</td>
      <td style="white-space:nowrap;font-size:11px">${d.category}</td>
      <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px" title="${d.detail}">${d.detail}</td>
      <td style="font-size:11px">${d.staff||'—'}</td>
      <td>${badgeHTML(d.status)}</td>
      <td style="font-size:10px;color:var(--text3)">${d.vin||'—'}</td>
      <td><div class="td-actions">
        <button class="act-btn edit" onclick="editIssue('${d.id}')" title="แก้ไข"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
        <button class="act-btn del" onclick="deleteIssue('${d.id}')" title="ลบ"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg></button>
      </div></td>
    </tr>`).join('')}</tbody>
  </table>
  <div style="font-size:11px;color:var(--text3);padding:8px 10px">${filtered.length} รายการ</div>`;
}

// ══ EDIT / DELETE ══
function editIssue(id){
  const d=loadData().find(x=>x.id===id); if(!d) return;
  editingId=id;
  document.getElementById('mStatus').value=d.status||'รอดำเนินการ';
  document.getElementById('mStaff').value=d.staff||'';
  document.getElementById('mNote').value=d.note||'';
  document.getElementById('editModal').style.display='flex';
}

function saveModal(){
  const data=loadData();
  const idx=data.findIndex(d=>d.id===editingId); if(idx<0) return;
  data[idx].status=document.getElementById('mStatus').value;
  data[idx].staff=document.getElementById('mStaff').value;
  data[idx].note=document.getElementById('mNote').value;
  saveData(data);
  closeModal();
  renderList();
  renderRecent();
  toast('✅ อัปเดตเรียบร้อย');
}

function closeModal(){ document.getElementById('editModal').style.display='none'; editingId=null; }

function deleteIssue(id){
  if(!confirm('ลบรายการนี้?')) return;
  saveData(loadData().filter(d=>d.id!==id));
  renderList();
  renderRecent();
  toast('🗑 ลบแล้ว');
}

// ══ EXPORT ══
function toggleExp(){
  document.getElementById('expMenu').classList.toggle('open');
}
document.addEventListener('click',e=>{
  const dd=document.querySelector('.exp-dd');
  if(dd&&!dd.contains(e.target)) document.getElementById('expMenu').classList.remove('open');
});

function exportExcel(){
  document.getElementById('expMenu').classList.remove('open');
  const data=loadData();
  if(!data.length){ toast('⚠ ไม่มีข้อมูล','#c2410c'); return; }
  const rows=data.map(d=>({
    'วันที่':d.date,'เวลา':d.time||'','ลูกค้า':d.customer,
    'รุ่นรถ':d.model,'VIN':d.vin||'','ประเภทปัญหา':d.category,
    'รายละเอียด':d.detail,'ผู้รับผิดชอบ':d.staff||'',
    'สถานะ':d.status,'หมายเหตุ':d.note||''
  }));
  const ws=XLSX.utils.json_to_sheet(rows);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Issue Tracker');
  // auto column width
  const wscols=Object.keys(rows[0]).map(k=>({wch:Math.max(k.length,12)}));
  ws['!cols']=wscols;
  XLSX.writeFile(wb,`xpeng_issues_${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('📊 ดาวน์โหลด Excel แล้ว');
}

function exportPDF(type){
  document.getElementById('expMenu').classList.remove('open');
  const data=loadData();
  if(!data.length){ toast('⚠ ไม่มีข้อมูล','#c2410c'); return; }
  const now=new Date().toLocaleDateString('th-TH',{year:'numeric',month:'long',day:'numeric'});
  const k=[data.length,data.filter(d=>d.status==='แก้ไขแล้ว').length,data.filter(d=>d.status==='กำลังดำเนินการ').length,data.filter(d=>d.status==='รอดำเนินการ').length,new Set(data.map(d=>d.model).filter(Boolean)).size];
  const kL=['ทั้งหมด','แก้ไขแล้ว','กำลังดำเนินการ','รอดำเนินการ','รุ่นรถ'];
  const kC=['#1a56db','#0e7d5e','#c2410c','#be123c','#6d28d9'];
  const cImgs=['cCat','cStatus','cStaff','cTrend'].map(id=>{ try{return document.getElementById(id)?.toDataURL('image/png')||'';}catch(e){return '';} });
  const cTitles=['ตามประเภทปัญหา','สถานะ','ผู้รับผิดชอบ','แนวโน้มรายวัน'];

  let html='';
  if(type==='full'){
    const tblRows=data.slice(0,200).map(d=>`<tr>
      <td>${d.date}</td><td>${d.customer}</td><td>${d.model}</td>
      <td>${d.category}</td><td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d.detail}</td>
      <td>${d.staff||'—'}</td><td>${d.status}</td></tr>`).join('');

    html=`<div style="font-family:'Sarabun',sans-serif;color:#1a1a1a">
      <div style="background:linear-gradient(135deg,#1a56db,#6d28d9);color:#fff;padding:28px 32px;margin-bottom:0">
        <div style="font-size:11px;opacity:.7;letter-spacing:1px;margin-bottom:4px">XPENG MOTORS · Issue Tracker</div>
        <div style="font-size:22px;font-weight:700;margin-bottom:6px">รายงานสรุปปัญหาการใช้งาน</div>
        <div style="font-size:12px;opacity:.85">จัดทำเมื่อ ${now}</div>
      </div>
      <div style="padding:20px 32px 0">
        <div style="font-size:11px;font-weight:600;color:#1a56db;margin-bottom:10px;letter-spacing:.5px">📊 สรุปตัวเลขสำคัญ</div>
        <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:20px">

// ══ TOAST ══
function toast(msg, bg='#1e293b'){
  const el=document.getElementById('toast');
  el.textContent=msg; el.style.background=bg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2500);
}

// ══ BACKUP / RESTORE ══
function backupData(){
  const data = loadData();
  if(!data.length){ toast('⚠ ไม่มีข้อมูลให้สำรอง','#c2410c'); return; }
  const payload = {
    version: 1,
    app: 'XPENG Issue Tracker',
    exportedAt: new Date().toISOString(),
    count: data.length,
    data: data
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `xpeng_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  toast(`✅ Backup ${data.length} รายการแล้ว`);
}

function restoreData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try{
      const payload = JSON.parse(ev.target.result);
      // รองรับทั้งแบบ array ตรงๆ และแบบมี wrapper
      const incoming = Array.isArray(payload) ? payload : (payload.data || []);
      if(!incoming.length){ toast('⚠ ไม่พบข้อมูลในไฟล์','#c2410c'); return; }

      const existing = loadData();
      if(existing.length > 0){
        const choice = confirm(
          `พบข้อมูลเดิม ${existing.length} รายการ
` +
          `ไฟล์ใหม่มี ${incoming.length} รายการ

` +
          `กด OK = รวมข้อมูล (ไม่ลบของเดิม)
` +
          `กด Cancel = แทนที่ทั้งหมด`
        );
        if(choice){
          // Merge — ไม่เอาซ้ำ (ตาม id)
          const existingIds = new Set(existing.map(d=>d.id));
          const newItems = incoming.filter(d=>!existingIds.has(d.id));
          const merged = [...existing, ...newItems];
          saveData(merged);
          toast(`✅ รวมข้อมูลแล้ว เพิ่ม ${newItems.length} รายการใหม่ (รวม ${merged.length} รายการ)`);
        } else {
          saveData(incoming);
          toast(`✅ แทนที่ข้อมูลแล้ว ${incoming.length} รายการ`);
        }
      } else {
        saveData(incoming);
        toast(`✅ นำเข้าข้อมูล ${incoming.length} รายการแล้ว`);
      }
      renderRecent();
      // refresh current view
      const activeView = document.querySelector('.view.active')?.id;
      if(activeView === 'viewDash') renderDash();
      if(activeView === 'viewList') renderList();
    }catch(err){
      toast('⚠ ไฟล์ไม่ถูกต้อง: '+err.message,'#c2410c');
    }
    e.target.value = ''; // reset input
  };
  reader.readAsText(file);
}
